name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: Check workspace
        run: cargo check --workspace

      - name: Run Rust workspace tests
        run: cargo test --workspace

      - name: Build CLI and daemon binaries
        run: cargo build -p turf-net --bin turf -p turf-daemon --bin turf-daemon

      - name: Run real-user PTY E2E tests (tmux)
        run: |
          if ! command -v tmux >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y tmux
          fi
          bash test/e2e-pty.sh

  node:
    name: Node.js CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Node.js tests
        run: npm test
