<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 155" width="860" height="155" role="img" aria-label="TurfCode CLI Architecture">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#c6d8f7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: url(#boxGrad); stroke: #64748b; stroke-width: 1.5; rx: 8; ry: 8; }
      .boxAccent { fill: url(#accentGrad); stroke: #3b82f6; stroke-width: 1.75; rx: 8; ry: 8; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #0f172a; text-anchor: middle; }
      .sub { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #334155; text-anchor: middle; }
      .lbl { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #94a3b8; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .bi { stroke: #64748b; stroke-width: 1.6; fill: none; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Launcher / Tunnel -->
  <rect class="box" x="12" y="24" width="132" height="54"/>
  <text class="title" x="78" y="47">CLI &amp; Tunnel</text>
  <text class="sub" x="78" y="64">turf-net</text>

  <!-- Cockpit -->
  <rect class="boxAccent" x="196" y="24" width="144" height="54"/>
  <text class="title" x="268" y="47">TUI Cockpit</text>
  <text class="sub" x="268" y="64">turf-tui</text>

  <!-- Daemon -->
  <rect class="box" x="392" y="24" width="144" height="54"/>
  <text class="title" x="464" y="47">Session Daemon</text>
  <text class="sub" x="464" y="64">turf-daemon</text>

  <!-- PTY / VTE -->
  <rect class="box" x="588" y="24" width="144" height="54"/>
  <text class="title" x="660" y="47">PTY &amp; Grid</text>
  <text class="sub" x="660" y="64">turf-pty / vte</text>

  <!-- Shells / AI CLIs -->
  <rect class="box" x="768" y="24" width="80" height="54"/>
  <text class="title" x="808" y="47">Shells</text>
  <text class="sub" x="808" y="64">codex/agy</text>

  <!-- Core / Protocol bottom row -->
  <rect class="box" x="255" y="102" width="175" height="42"/>
  <text class="title" x="342" y="120">Locks &amp; Worktrees</text>
  <text class="sub" x="342" y="135">turf-core</text>

  <rect class="box" x="454" y="102" width="165" height="42"/>
  <text class="title" x="536" y="120">Wire &amp; State Types</text>
  <text class="sub" x="536" y="135">turf-protocol</text>

  <!-- Horizontal arrows -->
  <path class="bi" d="M 146 51 L 194 51"/>
  <text class="lbl" x="170" y="43">WSS</text>

  <path class="bi" d="M 342 51 L 390 51"/>
  <text class="lbl" x="366" y="43">IPC</text>

  <path class="bi" d="M 538 51 L 586 51"/>
  <text class="lbl" x="562" y="43">Bytes</text>

  <path class="bi" d="M 734 51 L 766 51"/>
  <text class="lbl" x="750" y="43">TTY</text>

  <!-- Vertical links to Core & Protocol -->
  <path class="line" d="M 285 78 L 285 100"/>
  <path class="line" d="M 464 78 L 464 100"/>
</svg>
