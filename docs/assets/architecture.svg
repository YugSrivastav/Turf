<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 185" width="880" height="185" role="img" aria-label="Turf System Architecture">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Subtle card backdrop visible in both GitHub light & dark themes -->
  <rect x="2" y="2" width="876" height="181" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Node 1: CLI & Tunnel -->
  <rect x="20" y="24" width="136" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="88" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CLI &amp; Tunnel</text>
  <text x="88" y="66" font-family="Consolas, Menlo, monospace" font-size="11" fill="#334155" text-anchor="middle">turf-net</text>

  <!-- Node 2: TUI Cockpit -->
  <rect x="204" y="24" width="144" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="276" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">TUI Cockpit</text>
  <text x="276" y="66" font-family="Consolas, Menlo, monospace" font-size="11" fill="#1e40af" text-anchor="middle">turf-tui</text>

  <!-- Node 3: Session Daemon -->
  <rect x="396" y="24" width="144" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="468" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Session Daemon</text>
  <text x="468" y="66" font-family="Consolas, Menlo, monospace" font-size="11" fill="#334155" text-anchor="middle">turf-daemon</text>

  <!-- Node 4: PTY & VTE Grid -->
  <rect x="588" y="24" width="144" height="58" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="660" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">PTY &amp; Grid</text>
  <text x="660" y="66" font-family="Consolas, Menlo, monospace" font-size="11" fill="#334155" text-anchor="middle">turf-pty / vte</text>

  <!-- Node 5: Shells & CLIs -->
  <rect x="768" y="24" width="92" height="58" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="814" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Shells</text>
  <text x="814" y="66" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534" text-anchor="middle">codex / agy</text>

  <!-- Core bottom left -->
  <rect x="204" y="116" width="196" height="46" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="302" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">Locks &amp; Worktrees</text>
  <text x="302" y="152" font-family="Consolas, Menlo, monospace" font-size="11" fill="#92400e" text-anchor="middle">turf-core</text>

  <!-- Protocol bottom right -->
  <rect x="444" y="116" width="196" height="46" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="542" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">IPC &amp; State Contracts</text>
  <text x="542" y="152" font-family="Consolas, Menlo, monospace" font-size="11" fill="#334155" text-anchor="middle">turf-protocol</text>

  <!-- Horizontal arrows + labels -->
  <line x1="158" y1="53" x2="201" y2="53" stroke="#64748b" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="180" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">WSS</text>

  <line x1="350" y1="53" x2="393" y2="53" stroke="#64748b" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="372" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">IPC</text>

  <line x1="542" y1="53" x2="585" y2="53" stroke="#64748b" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="564" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">Stream</text>

  <line x1="734" y1="53" x2="765" y2="53" stroke="#64748b" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="750" y="45" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">TTY</text>

  <!-- Vertical connectors -->
  <line x1="276" y1="84" x2="276" y2="113" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="468" y1="84" x2="468" y2="113" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="402" y1="139" x2="441" y2="139" stroke="#64748b" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
</svg>
