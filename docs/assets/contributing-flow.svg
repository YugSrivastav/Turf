<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 128" width="880" height="128" role="img" aria-label="Turf Pull Request Contribution Flow">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="876" height="124" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <rect x="18" y="32" width="142" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="89" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">1. Branch</text>
  <text x="89" y="75" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155" text-anchor="middle">feat/ or fix/</text>

  <rect x="190" y="32" width="146" height="62" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="263" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">2. Implement</text>
  <text x="263" y="75" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#1e40af" text-anchor="middle">Edit crates/</text>

  <rect x="366" y="32" width="152" height="62" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="442" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">3. Verify</text>
  <text x="442" y="75" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e" text-anchor="middle">cargo test + e2e</text>

  <rect x="548" y="32" width="148" height="62" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="622" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">4. Pull Request</text>
  <text x="622" y="75" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155" text-anchor="middle">Update docs/ADR.md</text>

  <rect x="726" y="32" width="136" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="794" y="57" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">5. CI &amp; Merge</text>
  <text x="794" y="75" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534" text-anchor="middle">Review -&gt; main</text>

  <line x1="162" y1="63" x2="187" y2="63" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr3)"/>
  <line x1="338" y1="63" x2="363" y2="63" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr3)"/>
  <line x1="520" y1="63" x2="545" y2="63" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr3)"/>
  <line x1="698" y1="63" x2="723" y2="63" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr3)"/>
</svg>
