<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140" role="img" aria-label="TurfCode Multiplayer &amp; Parallel Worktree Workflow">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="2" y="2" width="876" height="136" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="18" y="34" width="142" height="66" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="89" y="61" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">1. Host Repo</text>
  <text x="89" y="80" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#1e40af" text-anchor="middle">turf host &lt;dir&gt;</text>

  <!-- Step 2 -->
  <rect x="190" y="34" width="150" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="265" y="61" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">2. Encrypted Join</text>
  <text x="265" y="80" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155" text-anchor="middle">TURF-XXXX (GCM)</text>

  <!-- Step 3 -->
  <rect x="370" y="34" width="152" height="66" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="446" y="61" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">3. Atomic Locks</text>
  <text x="446" y="80" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#92400e" text-anchor="middle">All-or-nothing files</text>

  <!-- Step 4 -->
  <rect x="552" y="34" width="152" height="66" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="628" y="61" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">4. Isolated Branch</text>
  <text x="628" y="80" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#334155" text-anchor="middle">.turf/worktrees/*</text>

  <!-- Step 5 -->
  <rect x="734" y="34" width="128" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="798" y="61" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">5. Squash Merge</text>
  <text x="798" y="80" font-family="Consolas, Menlo, monospace" font-size="10.5" fill="#166534" text-anchor="middle">Co-authored-by</text>

  <!-- Connecting arrows -->
  <line x1="162" y1="67" x2="187" y2="67" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="342" y1="67" x2="367" y2="67" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="524" y1="67" x2="549" y2="67" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr2)"/>
  <line x1="706" y1="67" x2="731" y2="67" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr2)"/>
</svg>
